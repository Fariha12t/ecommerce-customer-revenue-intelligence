# One-command run:   docker compose up --build
# Put the Olist CSVs in ./data/raw first (python scripts/download_olist.py).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ecommerce_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10

  pipeline:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ecommerce_intelligence
      PGUSER: postgres
      PGPASSWORD: ${PGPASSWORD:-postgres}
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    command: >
      bash -c "python -m src.etl
      && python -m src.analytics
      && python -m src.load_postgres
      && python -m src.insights
      && python -m src.ml.train --no-mlflow
      && python -m src.ml.late_delivery --no-mlflow"

volumes:
  pgdata:
